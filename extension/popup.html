<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulp Focus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0f0a;
      color: #e4e4e7;
      overflow-x: hidden;
    }

    .header {
      padding: 16px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: rgba(0,0,0,0.3);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
    }

    .logo-text {
      font-family: 'EB Garamond', serif;
      font-size: 20px;
      font-weight: 800;
      color: #6ee7b7;
      letter-spacing: -0.02em;
    }

    .level-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.15);
    }

    .level-num {
      font-family: 'EB Garamond', serif;
      font-size: 13px;
      font-weight: 800;
      color: #fbbf24;
    }

    .level-name {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(251,191,36,0.6);
    }

    .currencies {
      display: flex;
      gap: 10px;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .currency {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .currency.sun {
      background: rgba(234,179,8,0.1);
      border: 1px solid rgba(234,179,8,0.12);
      color: #fde047;
    }

    .currency.gem {
      background: rgba(168,85,247,0.1);
      border: 1px solid rgba(168,85,247,0.12);
      color: #c084fc;
    }

    .xp-section {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .xp-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .xp-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #52525b;
    }

    .xp-bar-bg {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      overflow: hidden;
    }

    .xp-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #16a34a, #22c55e, #4ade80);
      transition: width 0.6s ease;
    }

    .xp-sub {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    .xp-sub span {
      font-size: 9px;
      color: #3f3f46;
      font-variant-numeric: tabular-nums;
    }

    .grove-section {
      padding: 14px 18px;
    }

    .grove-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(110,231,183,0.7);
      margin-bottom: 10px;
    }

    .grove-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .plot {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.015);
      position: relative;
      overflow: hidden;
    }

    .plot.filled {
      background: rgba(6,78,59,0.15);
      border-color: rgba(6,78,59,0.25);
    }

    .plot-empty {
      font-size: 18px;
      color: #27272a;
    }

    .plant-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin-bottom: 4px;
    }

    .plant-name {
      font-size: 7px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #52525b;
    }

    .plant-bar-bg {
      width: 80%;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      margin-top: 3px;
      overflow: hidden;
    }

    .plant-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #34d399, #10b981);
    }

    .grown-badge {
      font-size: 7px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #10b981;
      margin-top: 3px;
    }

    .focus-section {
      padding: 14px 18px;
      border-top: 1px solid rgba(255,255,255,0.03);
    }

    .focus-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: rgba(251,191,36,0.6);
      margin-bottom: 8px;
    }

    .focus-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .focus-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .focus-dot.on { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .focus-dot.off { background: #3f3f46; }

    .focus-label {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      flex: 1;
    }

    .blocked-count {
      font-size: 10px;
      color: #52525b;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      text-align: center;
      padding: 40px 24px;
    }

    .empty-state p {
      font-size: 12px;
      color: #52525b;
      line-height: 1.6;
      margin-bottom: 6px;
    }

    .empty-state .hint {
      font-size: 10px;
      color: #3f3f46;
    }

    .footer {
      padding: 10px 18px 14px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.03);
    }

    .footer p {
      font-size: 9px;
      color: rgba(110,231,183,0.25);
      font-style: italic;
      letter-spacing: 0.04em;
      font-family: 'EB Garamond', serif;
    }

    .rarity-common { opacity: 0.9; }
    .rarity-uncommon { box-shadow: 0 0 8px rgba(249,115,22,0.2); }
    .rarity-rare { box-shadow: 0 0 10px rgba(250,204,21,0.25); }
    .rarity-premium { box-shadow: 0 0 12px rgba(219,39,119,0.3); }
    .rarity-chroma { box-shadow: 0 0 14px rgba(192,132,252,0.3); animation: glow 2s ease-in-out infinite alternate; }
    .rarity-extinct { box-shadow: 0 0 16px rgba(76,29,149,0.4); animation: glow 1.5s ease-in-out infinite alternate; }

    @keyframes glow {
      from { filter: brightness(1); }
      to { filter: brightness(1.3); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
