<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulp Focus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      font-family: 'EB Garamond', Georgia, serif;
      background: #0a0a0c;
      color: #e4e4e7;
      overflow-x: hidden;
    }

    .header {
      padding: 20px 20px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .logo-icon {
      width: 24px;
      height: 24px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 800;
      color: #e4e4e7;
      letter-spacing: -0.02em;
    }

    .logo-sub {
      font-size: 11px;
      color: #52525b;
      font-weight: 400;
      margin-left: 4px;
    }

    /* Blocker status */
    .status-section {
      padding: 20px;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,0.5);
    }

    .status-dot.inactive {
      background: #27272a;
      border: 1.5px solid #3f3f46;
    }

    .status-info {
      flex: 1;
      min-width: 0;
    }

    .status-label {
      font-size: 14px;
      font-weight: 700;
      color: #e4e4e7;
      line-height: 1.2;
    }

    .status-detail {
      font-size: 11px;
      color: #52525b;
      margin-top: 2px;
    }

    /* Timer section */
    .timer-section {
      padding: 0 20px 20px;
    }

    .timer-card {
      padding: 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      text-align: center;
    }

    .timer-time {
      font-size: 36px;
      font-weight: 700;
      color: #e4e4e7;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .timer-label {
      font-size: 11px;
      color: #52525b;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      margin-top: 6px;
    }

    .tree-preview {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .tree-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.08);
    }

    .tree-name {
      font-size: 12px;
      color: #71717a;
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #e67e22, #f5a030);
      transition: width 0.5s ease;
    }

    /* Idle state */
    .idle-section {
      padding: 0 20px 24px;
      text-align: center;
    }

    .idle-text {
      font-size: 13px;
      color: #3f3f46;
      line-height: 1.5;
      font-style: italic;
    }

    /* Done state */
    .done-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.15);
      color: #22c55e;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
