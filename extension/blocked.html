<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked — Pulp Focus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0f0a 0%, #0f1a0f 50%, #0a0f0a 100%);
      color: #e4e4e7;
      text-align: center;
      overflow: hidden;
    }
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      font-size: 20px;
      animation: float 8s ease-in-out infinite;
      opacity: 0.15;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
      25% { opacity: 0.2; }
      50% { transform: translateY(-40px) rotate(10deg); opacity: 0.15; }
      75% { opacity: 0.1; }
    }
    .container {
      max-width: 380px;
      padding: 48px 32px;
      position: relative;
      z-index: 1;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    h1 {
      font-family: 'EB Garamond', serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #fafafa;
    }
    .site {
      font-size: 13px;
      color: #52525b;
      font-weight: 500;
      margin-bottom: 20px;
      font-family: monospace;
      padding: 4px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      display: inline-block;
    }
    p {
      font-size: 14px;
      color: #71717a;
      line-height: 1.7;
    }
    .quote {
      margin-top: 24px;
      font-family: 'EB Garamond', serif;
      font-size: 13px;
      font-style: italic;
      color: rgba(110,231,183,0.3);
      letter-spacing: 0.02em;
    }
    .back {
      display: inline-block;
      margin-top: 32px;
      padding: 10px 28px;
      border-radius: 10px;
      background: #fafafa;
      color: #0a0a0a;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .back:hover { opacity: 0.85; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="particles">
    <span class="particle" style="left:10%;top:20%;animation-delay:0s">🌿</span>
    <span class="particle" style="left:25%;top:60%;animation-delay:1.5s">🍃</span>
    <span class="particle" style="left:55%;top:15%;animation-delay:3s">🌸</span>
    <span class="particle" style="left:75%;top:45%;animation-delay:0.8s">🦋</span>
    <span class="particle" style="left:85%;top:70%;animation-delay:2.2s">✨</span>
    <span class="particle" style="left:40%;top:80%;animation-delay:4s">🌼</span>
  </div>
  <div class="container">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="m4.93 4.93 14.14 14.14"/>
      </svg>
    </div>
    <h1>Stay focused.</h1>
    <div class="site" id="site"></div>
    <p>This site is blocked during your focus session.<br/>Get back to writing — your garden is growing.</p>
    <p class="quote">"An orchard is grown with patience and nurtured by persistence."</p>
    <button class="back" onclick="history.back()">Go Back</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    const site = params.get("site")
    if (site) document.getElementById("site").textContent = site
  </script>
</body>
</html>
